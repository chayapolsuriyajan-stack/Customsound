<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anamorphic Window</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #ddd;
      font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas#view, canvas#hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    canvas#hud { pointer-events: none; }
    #panel { position: fixed; top: 12px; left: 12px; width: 250px; padding: 12px 14px;
      background: rgba(12, 13, 15, 0.78); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      backdrop-filter: blur(8px); }
    #panel h1 { margin: 0 0 2px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }
    #panel p { margin: 0 0 10px; color: #8a8f96; }
    .row { display: flex; gap: 6px; margin-bottom: 10px; }
    button { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #ddd; font: inherit; cursor: pointer; }
    button:hover { background: rgba(255,255,255,0.12); }
    button.on { background: #e9e9e7; color: #111; }
    #camBtn { width: 100%; background: #c33; border-color: #e55; color: #fff; margin-bottom: 10px; }
    #camBtn:disabled { opacity: 0.7; cursor: default; }
    label { display: grid; grid-template-columns: 1fr auto; margin-bottom: 6px; color: #aab; }
    label input { grid-column: 1 / -1; width: 100%; accent-color: #e44; }
    .keys { color: #6b7078; margin-top: 6px; }
    #previewWrap { position: fixed; right: 12px; bottom: 12px; border: 1px solid rgba(255,60,60,0.6); }
    #previewWrap canvas { display: block; width: 240px; height: 135px; }
    .hidden, body.clean #panel { display: none !important; }
    video { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="hud"></canvas>

  <div id="panel">
    <h1>Anamorphic window</h1>
    <p>Head-tracked off-axis projection. Move your head — the screen becomes a window.</p>
    <button id="camBtn">Start camera (head tracking)</button>
    <div class="row">
      <button data-scene="gravity">1 · Gravity</button>
      <button data-scene="float">2 · Float</button>
    </div>
    <label>Screen width (cm) <span id="sw-v"></span><input id="sw" type="range" min="25" max="200" step="1" /></label>
    <label>Viewing distance (cm) <span id="dist-v"></span><input id="dist" type="range" min="20" max="200" step="1" /></label>
    <label>Sensitivity <span id="sens-v"></span><input id="sens" type="range" min="0.3" max="3" step="0.05" /></label>
    <label>Webcam FOV (°) <span id="fov-v"></span><input id="fov" type="range" min="40" max="100" step="1" /></label>
    <div class="keys">No camera? Move the mouse (wheel = distance).<br />
      Keys: 1/2 scene · C camera · A auto · D HUD · P preview · H hide panel · F fullscreen</div>
  </div>

  <div id="previewWrap" class="hidden"><canvas id="preview"></canvas></div>
  <video id="cam" playsinline muted></video>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
