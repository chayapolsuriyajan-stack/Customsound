[package]
name = "minicode"
version = "0.1.0"
description = "A minimal VS Code-style IDE"
authors = ["MiniCode"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# Size is the whole point of choosing Tauri over Electron, so the release
# profile optimises for bytes rather than speed. On a text editor whose hot
# loop lives in the webview, the runtime cost of opt-level="z" is invisible.
[profile.release]
opt-level = "z"      # optimise for size
lto = true           # cross-crate dead code elimination
codegen-units = 1    # better optimisation at the cost of build time
panic = "abort"      # drop the unwinding tables
strip = true         # strip symbols from the binary
incremental = false
